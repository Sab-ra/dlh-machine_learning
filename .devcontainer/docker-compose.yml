version: '3.8'

services:
  app:
    build: 
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    network_mode: service:mysql

  mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  mongo:
    image: mongo:4.4.29
    network_mode: service:mysql
    ports:
      - "27017:27017"
